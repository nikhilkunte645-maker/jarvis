# ============================================================
# JARVIS – Global Configuration
# Edit this file to customize your JARVIS installation.
# ============================================================

jarvis:
  name: "JARVIS"
  version: "1.0.0"
  language: "en"

# ──────────────────────────────────────────────
# Audio & Speech-to-Text
# ──────────────────────────────────────────────
audio:
  sample_rate: 16000
  channels: 1
  chunk_size: 512                  # must match Silero VAD window (512 @ 16 kHz = 32 ms)
  device_index: null               # null = system default microphone

  # Wake-word settings
  wake_word:
    enabled: true
    keyword: "jarvis"              # trigger phrase
    backend: "openwakeword"        # openwakeword | porcupine | none
    porcupine_access_key: ""       # only needed for porcupine backend

  # VAD (Voice Activity Detection)
  vad:
    enabled: true
    backend: "webrtcvad"           # webrtcvad | silero | none
    aggressiveness: 2              # webrtcvad: 0-3
    threshold: 0.3                 # Silero VAD score threshold (0.0-1.0); lower = more sensitive
    silence_timeout_ms: 800        # ms of silence before end-of-speech

  # STT (Speech-to-Text)
  stt:
    backend: "faster_whisper"      # faster_whisper | whisper | vosk
    model_size: "base.en"          # tiny | base | small | medium | large
    device: "cpu"                  # cpu | cuda
    compute_type: "int8"           # int8 | float16 | float32
    beam_size: 5
    language: "en"

# ──────────────────────────────────────────────
# LLM / Intent Engine ("Brain")
# ──────────────────────────────────────────────
brain:
  backend: "ollama"                # ollama | openai | anthropic
  model: "llama3.2"                # Ollama: any pulled model; OpenAI: gpt-4o, etc.
  ollama_host: "http://localhost:11434"
  temperature: 0.1
  max_tokens: 512
  timeout_seconds: 30

  # Cloud fallback (only used when backend = openai or anthropic)
  cloud:
    enabled: false
    openai_model: "gpt-4o-mini"
    anthropic_model: "claude-3-haiku-20240307"

  # Short-term memory
  memory:
    max_history: 8                 # number of exchanges to keep
    summary_on_overflow: true

# ──────────────────────────────────────────────
# Laptop Bridge
# ──────────────────────────────────────────────
laptop:
  platform_overrides: {}           # optional per-OS tweaks
  screenshot_dir: "~/Desktop/jarvis_screenshots"
  browser:
    default: "chrome"              # chrome | firefox | edge | safari
  volume:
    step: 5                        # percent per step

# ──────────────────────────────────────────────
# Phone Bridge (ADB)
# ──────────────────────────────────────────────
phone:
  enabled: true
  serial: ""                       # leave blank for auto-detect (first device)
  connection_mode: "usb"           # usb | wifi
  wifi_host: ""                    # e.g. 192.168.1.5:5555 for wireless ADB
  adb_path: "adb"                  # full path if adb not on PATH
  screenshot_dir: "/sdcard/DCIM/jarvis"
  pull_dir: "~/Desktop/jarvis_phone"
  uiautomator2:
    enabled: true
    atx_agent_port: 7912

# ──────────────────────────────────────────────
# TTS / Voice Feedback
# ──────────────────────────────────────────────
tts:
  tts_engine: "offline"            # edge | offline
  voice: "en-US-GuyNeural"         # edge-tts voice name
  rate: "+0%"
  volume: "+0%"
  piper_model: ""                  # path to .onnx model when using piper

# ──────────────────────────────────────────────
# UI / HUD
# ──────────────────────────────────────────────
ui:
  backend: "terminal"              # terminal | customtkinter | none
  theme: "dark"
  show_transcription: true
  show_intent_json: false

# ──────────────────────────────────────────────
# Safety
# ──────────────────────────────────────────────
safety:
  require_confirmation:
    - "send_message"
    - "delete_file"
    - "make_call"
    - "payment"
    - "uninstall_app"
  confirmation_timeout_seconds: 10

# ──────────────────────────────────────────────
# Logging
# ──────────────────────────────────────────────
logging:
  level: "INFO"                    # DEBUG | INFO | WARNING | ERROR
  file: "logs/jarvis.log"
  rotation: "10 MB"
  retention: "7 days"
  colorize: true
